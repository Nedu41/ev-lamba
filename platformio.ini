; ev-lamba - Merkezi HUB
; ESP32 + TFT ekran; ESP01 role/lamba dugumlerini proxy uzerinden yonetir,
; gunes dogumu/batimi + hava durumuna gore otomasyon, MQTT (HiveMQ), Telegram uyarilari.
;
; Onceki Arduino IDE ortami: esp32 core v2.0.18, board "ESP32 Dev Module" (arduino-esp32 v3.1.0),
; PSRAM enable, Partition Scheme: Huge APP. Asagidaki ayarlar bunun PlatformIO karsiligidir;
; ilk derlemede (`pio run`) dogrulanmistir.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ 7.4.2
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8

; TFT_eSPI'nin kendi User_Setup.h dosyasina dokunmadan, ekran pinlerini
; build_flags ile veriyoruz (D:\Arduino\libraries\TFT_eSPI\User_Setup.h ile ayni degerler).
build_flags =
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
