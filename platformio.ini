; ev-lamba - Merkezi HUB
; ESP32 + TFT ekran; ESP01 role/lamba dugumlerini proxy uzerinden yonetir,
; gunes dogumu/batimi + hava durumuna gore otomasyon, MQTT (HiveMQ), Telegram uyarilari.
;
; Board "ESP32 Dev Module" (ESP32-D0WD-V3, PSRAM yok). OTA: --upload-port merkezihub.local

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; min_spiffs: iki 1.875MB uygulama bolumu (OTA icin sart) + 128KB LittleFS.
; huge_app.csv'de ikinci uygulama bolumu yoktu - OTA imkansizdi.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ 7.4.2
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8
    https://github.com/ESP32Async/AsyncTCP.git @ ^3.3.2
    https://github.com/ESP32Async/ESPAsyncWebServer.git @ ^3.7.7

; TFT_eSPI'nin kendi User_Setup.h dosyasina dokunmadan, ekran pinlerini
; build_flags ile veriyoruz (Arduino kutuphanesindeki TFT_eSPI User_Setup.h ile ayni degerler).
; BOARD_HAS_PSRAM yok: kart ESP32-D0WD-V3, PSRAM'siz (acilista "PSRAM ID read error")
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; WS istemci basina kuyruk (varsayilan 32 x ~8KB durum mesaji) - PSRAM'siz
    ; HUB'da yavas istemci bellegi tuketip cokertiyordu. Dolarsa baglanti kapanir.
    -DWS_MAX_QUEUED_MESSAGES=4
