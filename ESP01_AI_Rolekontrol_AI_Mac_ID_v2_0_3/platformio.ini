; ESP01 Role Kontrol Firmware - PlatformIO projesi
; Donanim: AI-Thinker ESP-01 (ESP8266), 1MB Flash
; Arduino IDE'de de acilabilir (kok dizindeki .ino), bu sadece derleme/olcum/OTA icin.

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
; USB programlayici sabit COM15 - HUB (COM3) takiliyken yanlis porta gitmesin
upload_port = COM15
monitor_port = COM15
; USB yuklemede MAC'i okuyup bu dosyaya otomatik OTA ortami ekler
extra_scripts = post:auto_ota.py

; esp01_1m board'unun varsayilani (eagle.flash.1m256.ld) 256KB'i SPIFFS'e ayiriyor.
; Proje SPIFFS/LittleFS KULLANMIYOR (sadece kucuk EEPROM) - bu alan bosa gidiyor ve
; OTA icin gereken serbest alani ciddi daraltiyor (~743KB sketch alani -> free ~340KB).
; FS'siz varyanta gecince sketch alani ~999KB'a cikiyor, OTA icin ~600KB+ serbest alan kaliyor.
board_build.ldscript = eagle.flash.1m.ld

; DOUT: her flas cipinde calisan guvenli mod (board varsayilani QIO).
board_build.flash_mode = dout

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ 7.4.2
    knolleary/PubSubClient @ ^2.8
    arduino-libraries/NTPClient @ ^3.2.1

; ESP-07 (ESP8266EX, 1MB) soket test cihazi - COM17, ayni firmware/ayni bellek duzeni
[env:esp07_1m]
extends = env:esp01_1m
upload_port = COM17
monitor_port = COM17
; Soket test kartinin LED'leri ve modulun mavi LED'i GPIO0/GPIO2'de - roleler ESP-01 ile ayni pinler

; Gercek ESP-07 devresi icin: roleler GPIO4/GPIO5 (GPIO0/2 strapping pinlerinden kacinir)
[env:esp07_gpio45]
extends = env:esp07_1m
build_flags = -DBOARD_ESP07

; ESP32-C3 SuperMini - ayni firmware (kodda #ifdef ESP32). USB'den dogrudan
; yuklenir, programlayici gerekmez. Roleler GPIO3 / GPIO4. mDNS: c3-xxxxxx.local
[env:c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = COM16
monitor_port = COM16
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = post:auto_ota.py
custom_host_prefix = c3-
lib_deps = ${env:esp01_1m.lib_deps}

; Kablosuz (OTA) yukleme - PlatformIO Project Tasks'ta ayri gorunur.
; Adres mDNS: esp01-<MAC'in son 6 hanesi>.local (IP degisse de calisir)
[env:masa_lamba_ota]
extends = env:esp01_1m
upload_protocol = espota
upload_port = esp01-786843.local

[env:turuncu_lamba_ota]
extends = env:esp01_1m
upload_protocol = espota
upload_port = esp01-ecc2c7.local

[env:esp01_00d43f_ota]
extends = env:esp01_1m
upload_protocol = espota
upload_port = esp01-00d43f.local

[env:esp01_403e0f_ota]
extends = env:esp01_1m
upload_protocol = espota
upload_port = esp01-403e0f.local

[env:esp01_ed88cf_ota]
extends = env:esp01_1m
upload_protocol = espota
upload_port = esp01-ed88cf.local
; Bu modulun flas cipi (d8, lehim sonrasi) 40MHz'te cokuyor, 20MHz'te aciliyor ama
; agi kararsiz (2026-09-29). 20MHz SADECE bu modulde - diger ESP01'ler varsayilan 40MHz.
board_build.f_flash = 20000000L

[env:esp01_7871e5_ota]
extends = env:esp01_1m
upload_protocol = espota
upload_port = esp01-7871e5.local

[env:esp01_69093d_ota]
extends = env:esp01_1m
upload_protocol = espota
upload_port = esp01-69093d.local

[env:c3_86ef2c_ota]
extends = env:c3_supermini
upload_protocol = espota
upload_port = c3-86ef2c.local

